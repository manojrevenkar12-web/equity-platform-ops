# Workload Identity: both map to the one GCP service account Terraform creates; no key files.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  annotations:
    iam.gke.io/gcp-service-account: equity-workloads@equity-platform-prod.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  annotations:
    iam.gke.io/gcp-service-account: equity-workloads@equity-platform-prod.iam.gserviceaccount.com
automountServiceAccountToken: false
