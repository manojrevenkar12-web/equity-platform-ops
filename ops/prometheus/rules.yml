# Generated by `python -m epo.eval.cli rules` from config/slo.yaml. Do not edit.
groups:
- name: slo-api_availability
  rules:
  - record: slo:api_availability:budget_per_minute
    expr: sum(increase(trpc_requests_total[1d])) / 1440 * 0.001
  - record: slo:api_availability:bad_60m
    expr: sum(increase(trpc_requests_total{code=~"5..|INTERNAL_SERVER_ERROR"}[60m]))
  - record: slo:api_availability:bad_5m
    expr: sum(increase(trpc_requests_total{code=~"5..|INTERNAL_SERVER_ERROR"}[5m]))
  - record: slo:api_availability:bad_360m
    expr: sum(increase(trpc_requests_total{code=~"5..|INTERNAL_SERVER_ERROR"}[360m]))
  - record: slo:api_availability:bad_30m
    expr: sum(increase(trpc_requests_total{code=~"5..|INTERNAL_SERVER_ERROR"}[30m]))
  - alert: ApiAvailabilityBudgetBurn60m
    expr: slo:api_availability:bad_60m > 14.4 * 60 * slo:api_availability:budget_per_minute
      and slo:api_availability:bad_5m > 14.4 * 5 * slo:api_availability:budget_per_minute
    labels:
      severity: page
      slo: api_availability
      service: api
    annotations:
      summary: 'api_availability: error budget burning at 14.4x over 60m'
      runbook_url: https://github.com/manojrevenkar12-web/equity-platform-ops/blob/main/docs/runbooks/api_availability.md
  - alert: ApiAvailabilityBudgetBurn360m
    expr: slo:api_availability:bad_360m > 6 * 360 * slo:api_availability:budget_per_minute
      and slo:api_availability:bad_30m > 6 * 30 * slo:api_availability:budget_per_minute
    labels:
      severity: page
      slo: api_availability
      service: api
    annotations:
      summary: 'api_availability: error budget burning at 6x over 360m'
      runbook_url: https://github.com/manojrevenkar12-web/equity-platform-ops/blob/main/docs/runbooks/api_availability.md
  - alert: ApiAvailabilitySlowBurn
    expr: sum(increase(trpc_requests_total{code=~"5..|INTERNAL_SERVER_ERROR"}[3d]))
      > 1 * 4320 * slo:api_availability:budget_per_minute
    labels:
      severity: ticket
      slo: api_availability
      service: api
    annotations:
      summary: 'api_availability: budget spent at the rate it accrues over 3 days'
- name: slo-api_latency
  rules:
  - record: slo:api_latency:budget_per_minute
    expr: sum(increase(trpc_requests_total[1d])) / 1440 * 0.01
  - record: slo:api_latency:bad_60m
    expr: sum(increase(trpc_requests_slow_total[60m]))
  - record: slo:api_latency:bad_5m
    expr: sum(increase(trpc_requests_slow_total[5m]))
  - record: slo:api_latency:bad_360m
    expr: sum(increase(trpc_requests_slow_total[360m]))
  - record: slo:api_latency:bad_30m
    expr: sum(increase(trpc_requests_slow_total[30m]))
  - alert: ApiLatencyBudgetBurn60m
    expr: slo:api_latency:bad_60m > 14.4 * 60 * slo:api_latency:budget_per_minute
      and slo:api_latency:bad_5m > 14.4 * 5 * slo:api_latency:budget_per_minute
    labels:
      severity: page
      slo: api_latency
      service: api
    annotations:
      summary: 'api_latency: error budget burning at 14.4x over 60m'
      runbook_url: https://github.com/manojrevenkar12-web/equity-platform-ops/blob/main/docs/runbooks/api_latency.md
  - alert: ApiLatencyBudgetBurn360m
    expr: slo:api_latency:bad_360m > 6 * 360 * slo:api_latency:budget_per_minute and
      slo:api_latency:bad_30m > 6 * 30 * slo:api_latency:budget_per_minute
    labels:
      severity: page
      slo: api_latency
      service: api
    annotations:
      summary: 'api_latency: error budget burning at 6x over 360m'
      runbook_url: https://github.com/manojrevenkar12-web/equity-platform-ops/blob/main/docs/runbooks/api_latency.md
  - alert: ApiLatencySlowBurn
    expr: sum(increase(trpc_requests_slow_total[3d])) > 1 * 4320 * slo:api_latency:budget_per_minute
    labels:
      severity: ticket
      slo: api_latency
      service: api
    annotations:
      summary: 'api_latency: budget spent at the rate it accrues over 3 days'
- name: symptom-HighCpu
  rules:
  - alert: HighCpu
    expr: avg by (pod) (rate(container_cpu_usage_seconds_total[5m])) > 0.9
    for: 15m
    labels:
      severity: ticket
    annotations:
      summary: CPU above 90% for 15 minutes
- name: symptom-PodRestarts
  rules:
  - alert: PodRestarts
    expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
    for: 0m
    labels:
      severity: ticket
    annotations:
      summary: A pod restarted more than three times
- name: symptom-MongoReplicationLag
  rules:
  - alert: MongoReplicationLag
    expr: mongodb_replset_member_replication_lag > 30
    for: 10m
    labels:
      severity: ticket
    annotations:
      summary: Replication lag above 30 s
